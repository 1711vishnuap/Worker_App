name: service_marketplace
description: Service Marketplace MVP - connects customers with workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (simple ChangeNotifier-based, no boilerplate)
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Local storage (saves JWT token + user info on device)
  shared_preferences: ^2.3.2

  # Firebase (used for push notifications via FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # firebase_auth is included for a future upgrade to real Firebase Phone
  # Auth. The MVP currently uses simple backend-generated OTP (see
  # services/auth_service.dart for why) so this isn't wired in yet.
  firebase_auth: ^5.3.1

  # Location + Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0 # opens Google Maps app for turn-by-turn navigation

  # Photo picker for "Add Work" screen
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
